<svg viewBox="0 0 800 200" width="800" height="200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Catalin Teodorescu — CEO @ itguys-ro, Bucharest, Romania">
  <title>Catalin Teodorescu — CEO @ itguys-ro // Bucharest, Romania</title>

  <!-- cosmic-ui palette: primary rgb(20,160,230), accent rgb(202,65,34) -->
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050c14" />
      <stop offset="100%" stop-color="#0a1622" />
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e2536" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0a1a27" stop-opacity="0.95" />
    </linearGradient>
    <filter id="titleGlow" x="-15%" y="-40%" width="130%" height="180%">
      <feGaussianBlur stdDeviation="5" />
    </filter>
    <!-- signature angular frame: cut corners + one step notch top and bottom -->
    <path id="frame" d="M 10,30 L 30,10 L 320,10 L 332,22 L 468,22 L 480,10 L 770,10
                        L 790,30 L 790,170 L 770,190 L 480,190 L 468,178 L 332,178
                        L 320,190 L 30,190 L 10,170 Z" />
  </defs>

  <rect width="800" height="200" fill="url(#canvas)" />

  <!-- faint vertical guides, as on the cosmic-ui page ground -->
  <g stroke="rgb(20,160,230)" stroke-opacity="0.07" stroke-width="1">
    <path d="M200 0V200M400 0V200M600 0V200" />
  </g>

  <use href="#frame" fill="url(#panel)" stroke="rgb(20,160,230)" stroke-opacity="0.55" stroke-width="1.5" />
  <!-- inner hairline, offset: the doubled-border look -->
  <path d="M 18,33 L 33,18 L 317,18 L 329,30 L 471,30 L 483,18 L 767,18
           L 782,33 L 782,167 L 767,182 L 483,182 L 471,170 L 329,170
           L 317,182 L 33,182 L 18,167 Z"
        fill="none" stroke="rgb(20,160,230)" stroke-opacity="0.16" stroke-width="1" />

  <!-- brighter corner brackets -->
  <g fill="none" stroke="rgb(56,190,245)" stroke-opacity="0.9" stroke-width="2">
    <path d="M 10,58 L 10,30 L 30,10 L 62,10" />
    <path d="M 738,10 L 770,10 L 790,30 L 790,58" />
    <path d="M 790,142 L 790,170 L 770,190 L 738,190" />
    <path d="M 62,190 L 30,190 L 10,170 L 10,142" />
  </g>

  <!-- rust accent marks on the edges -->
  <g fill="rgb(202,65,34)">
    <rect x="82" y="6.5" width="78" height="7" />
    <rect x="168" y="6.5" width="7" height="7" />
    <rect x="179" y="6.5" width="7" height="7" />
    <rect x="190" y="6.5" width="7" height="7" />
    <rect x="640" y="186.5" width="78" height="7" />
    <rect x="603" y="186.5" width="7" height="7" />
    <rect x="614" y="186.5" width="7" height="7" />
    <rect x="625" y="186.5" width="7" height="7" />
  </g>

  <!-- tick row, the small dashed ornament -->
  <g fill="rgb(20,160,230)" fill-opacity="0.5">
    <rect x="332" y="24.5" width="18" height="2" />
    <rect x="356" y="24.5" width="10" height="2" />
    <rect x="450" y="172.5" width="18" height="2" />
    <rect x="434" y="172.5" width="10" height="2" />
  </g>

  <g font-family="'JetBrains Mono','SFMono-Regular','SF Mono',Menlo,Consolas,'Liberation Mono','Courier New',monospace"
     text-anchor="middle">
    <text x="400" y="104" font-size="42" letter-spacing="8" font-weight="700"
          fill="rgb(56,190,245)" filter="url(#titleGlow)">CATALIN TEODORESCU</text>
    <text x="400" y="104" font-size="42" letter-spacing="8" font-weight="700"
          fill="#eaf6ff">CATALIN TEODORESCU</text>
    <text x="400" y="136" font-size="12.5" letter-spacing="4.5"
          fill="rgb(20,160,230)" fill-opacity="0.85">CEO @ ITGUYS-RO // BUCHAREST, ROMANIA</text>
  </g>
</svg>
